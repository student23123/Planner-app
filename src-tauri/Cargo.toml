[package]
name = "planner-app"
version = "0.1.0"
description = "Daily planner with pomodoro, todos, calendar and D-day"
edition = "2021"

[lib]
name = "planner_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
